# 公開から7日未満の版を入れない。依存の乗っ取りへの備え
minimumReleaseAge: 10080
# 脆弱性 GHSA-g3hv-75wg-m249 の修正版とその新しい依存を7日待たずに入れる。2026-11-05 以降は不要
minimumReleaseAgeExclude:
  - minimatch@11.0.3
  - "@isaacs/nonrecursive-glob-match@1.0.3"
overrides:
  qs: ">=6.16.0"
  "minimatch@>=10.0.0 <11.0.1": "^11.0.3"
  vite@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
